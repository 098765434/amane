[package]
name = "amane"
version = "0.1.2"
edition = "2024"
license = "MIT"

[lib]
name = "amane"
path = "src/lib.rs"

[dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
vello = "0.11"
# only for glsl shaders, vello already brings wgpu and this turns on its glsl reader
wgpu = { version = "30.0", default-features = false, features = ["glsl"] }
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
# only for client_system, which hands the gpu libwayland's own display pointer
wayland-backend = { version = "0.3.17", features = ["client_system"] }
swash = "0.2.10"
zune-jpeg = "0.5.15"
png = "0.18.1"
inotify = { version = "0.11.5", default-features = false }
serde_json = "1.0.151"
# typed settings files (Config); zbus already builds it
serde = { version = "1.0", features = ["derive"] }
zbus = "5.19.0"
libpulse-binding = "2.30"
# turns svg icons into pixels once, so they draw like any other image
resvg = { version = "0.48.1", default-features = false }
bitflags = "2"
parley = "0.12"

[dev-dependencies]
chrono = "0.4"

[features]
# with AMANE_FRAMES=1, read back what each vello run took of the scratch
# buffers, to check a scene against the shell-sized limits (see
# docs/fork/internals/memory.md); slow, as every run waits for the gpu
vello-stats = ["vello/debug_layers"]

[lints.clippy]
# keep the zero-denominator guard explicit
manual_checked_ops = "allow"

[workspace]
members = ["cli", "cli/template/example"]

# vello's scratch buffers sized for a shell, not paris-30k: about 26 MB a set
# instead of 165, and the renderer keeps every set. A shell using amane as a
# git dependency repeats this in its own root manifest; a patch only applies
# from there. See docs/fork/internals/memory.md.
[patch.crates-io]
vello_encoding = { git = "https://github.com/098765434/vello", branch = "ocbk" }
