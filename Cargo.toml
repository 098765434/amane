[package]
name = "amane"
version = "0.1.2"
edition = "2024"
license = "MIT"

[lib]
name = "amane"
path = "src/lib.rs"

[dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
vello = "0.11"
# only for glsl shaders, vello already brings wgpu and this turns on its glsl reader
wgpu = { version = "30.0", default-features = false, features = ["glsl"] }
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
# only for client_system, which hands the gpu libwayland's own display pointer
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
swash = "0.2.10"
zune-jpeg = "0.5.15"
png = "0.18.1"
inotify = { version = "0.11.5", default-features = false }
serde_json = "1.0.151"
# typed settings files (Config); zbus already builds it
serde = { version = "1.0", features = ["derive"] }
zbus = "5.19.0"
libpulse-binding = "2.30"
# turns svg icons into pixels once, so they draw like any other image
resvg = { version = "0.48.1", default-features = false }
bitflags = "2"
# the kernel's uevent socket and /dev/rfkill (services/uevent.rs, services/rfkill.rs)
libc = "0.2"
# wipes password text when it goes away
zeroize = "1.9"
parley = "0.12"
mdns-sd = { version = "0.21.7", default-features = false }

[dev-dependencies]
chrono = "0.4"

[features]
# with AMANE_FRAMES=1, read back what each vello run took of the scratch
# buffers, to check a scene against the shell-sized limits, and print vello's
# own log (its image atlas size) on stderr (see docs/fork/internals/memory.md);
# slow, as every run waits for the gpu
vello-stats = ["vello/debug_layers", "dep:log"]

[dependencies.log]
# only to hear vello's atlas log under vello-stats; vello brings it anyway
version = "0.4"
optional = true

# The fork's lints. They hold over the whole crate, upstream's code
# included, so no attribute has to go into an upstream file. Stricter
# lints are turned on at the top of the fork's own files instead
# (#![warn(clippy::unwrap_used, …)]); see docs/fork/maintaining.md.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[lints.clippy]
# keep the zero-denominator guard explicit
manual_checked_ops = "allow"
# upstream's image filters index several buffers in step
needless_range_loop = "allow"

[workspace]
members = ["cli", "cli/template/example"]

# vello's scratch buffers sized for a shell, not paris-30k: about 29 MB a set
# instead of 165 (vello_encoding), and a renderer that lets the set go when
# idle instead of keeping it for life (vello). A shell using amane as a git
# dependency repeats both lines in its own root manifest; a patch only applies
# from there. See docs/fork/internals/memory.md.
[patch.crates-io]
vello = { git = "https://github.com/098765434/vello", rev = "46585523afff9ff403164902fd81f63794bd48d3" }
vello_encoding = { git = "https://github.com/098765434/vello", rev = "46585523afff9ff403164902fd81f63794bd48d3" }
